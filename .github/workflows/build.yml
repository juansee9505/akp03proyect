name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: pip install -r requirements.txt pytest
      - name: Autoprueba (Linux)
        run: |
          status=0
          xvfb-run python -m akp03 --self-test selftest.txt || status=$?
          cat selftest.txt
          exit $status
      - run: python -m pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compilar ejecutable e instalador
        shell: cmd
        env:
          AKP03_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: packaging\build_windows.bat
      - name: Autoprueba de los ejecutables en Windows
        shell: pwsh
        run: |
          $fail = $false
          foreach ($exe in @("dist\AKP03Controller\AKP03Controller.exe", "dist\AKP03Controller-portable.exe")) {
            $out = Join-Path $PWD ("selftest-" + [IO.Path]::GetFileNameWithoutExtension($exe) + ".txt")
            $p = Start-Process $exe -ArgumentList "--self-test", "`"$out`"" -PassThru -Wait
            Write-Host "===== $exe (código $($p.ExitCode)) ====="
            if (Test-Path $out) { Get-Content $out } else { Write-Host "No se generó el informe" }
            if ($p.ExitCode -ne 0 -or -not (Test-Path $out)) { $fail = $true }
          }
          if ($fail) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: AKP03Controller-windows
          path: |
            dist/AKP03Controller-portable.exe
            dist/AKP03Controller-Setup.exe
            selftest-*.txt
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AKP03Controller-portable.exe
            dist/AKP03Controller-Setup.exe
