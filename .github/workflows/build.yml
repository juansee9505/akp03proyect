name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compilar ejecutable e instalador
        shell: cmd
        env:
          AKP03_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0' }}
        run: packaging\build_windows.bat
      - name: Comprobar que el .exe arranca
        shell: pwsh
        run: |
          $p = Start-Process dist\AKP03Controller.exe -ArgumentList "--version" -PassThru -Wait
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: AKP03Controller-windows
          path: |
            dist/AKP03Controller.exe
            dist/AKP03Controller-Setup.exe
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AKP03Controller.exe
            dist/AKP03Controller-Setup.exe
